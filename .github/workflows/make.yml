name: make
on:
  workflow_dispatch:
    inputs:
      topic:
        description: "Video topic (khali = bot khud chunega)"
        required: false
        default: ""
  schedule:
    - cron: "30 11 * * *"   # roz 17:00 IST. Band karna ho to ye 2 line hata do.
permissions:
  contents: write
concurrency: make
jobs:
  make:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_OWNER_ID: ${{ secrets.TELEGRAM_OWNER_ID }}
      KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
      KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip }
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg zip
      - run: pip install -q -r requirements.txt
      - run: python gh_make.py "${{ inputs.topic }}"
